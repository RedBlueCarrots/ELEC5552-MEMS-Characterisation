<!DOCTYPE html>
<html lang="en">
<head>
    <title>Web Serial Device Controller</title>
</head>
<div class="control-group">
    <label for="baudRate">Baud Rate:</label>
    <select id="baudRate">
        <option value="9600">9600</option>
        <option value="19200">19200</option>
        <option value="38400">38400</option>
        <option value="57600">57600</option>
        <option value="115200" selected>115200</option>
    </select>
    <button id="connectBtn">Connect Serial Port</button>
</div>

<div class="control-group">
    <button id="sendBtn" disabled>Send "S000000000"</button>
</div>

<div class="control-group">
    <label>Console Log:</label>
    <div id="log"></div>
</div>

<script>
    let port;

    const connectBtn = document.getElementById('connectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const baudRateSelect = document.getElementById('baudRate');
    const logDiv = document.getElementById('log');

    function log(message) {
        logDiv.textContent += message + '\n';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        if (!('serial' in navigator)) {
            alert('Web Serial API not supported in this browser. Use Chrome, Edge, or Opera.');
            return;
        }

        try {
            port = await navigator.serial.requestPort();
            const baudRate = parseInt(baudRateSelect.value, 10);
            await port.open({ baudRate: baudRate });
            
            log(`Connected to serial port at ${baudRate} baud.`);
            connectBtn.textContent = 'Connected';
            connectBtn.disabled = true;
            baudRateSelect.disabled = true;
            sendBtn.disabled = false;
        } catch (error) {
            log(`Error: ${error.message}`);
        }
    });

    sendBtn.addEventListener('click', async () => {
        if (!port) return;

        try {
            const textEncoder = new TextEncoderStream();
            const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
            const writer = textEncoder.writable.getWriter();
            
            await writer.write("S000000000W000000020F000012340A000000304O000000005K000000345M000000100D000000040T000010000N000000000W000000020F000043210A000000204O000000015K000000145M000000200D000000400T000002000N000000000E000000000");
            log('Sent: S000000000W000000020F000012340A000000304O000000005K000000345M000000100D000000040T000010000N000000000W000000020F000043210A000000204O000000015K000000145M000000200D000000400T000002000N000000000E000000000');
            
            writer.releaseLink();
        } catch (error) {
            log(`Send error: ${error.message}`);
        }
    });
</script>
</body>
</html>
